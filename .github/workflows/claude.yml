name: Claude

# Mention @claude in an issue (title or body) or in a comment on an issue or PR.
# Claude works on a claude/* branch and opens a pull request against master.

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Only the repository owner can trigger a run (it spends their subscription).
    if: >-
      github.actor == 'gjdass' && (
        (github.event_name == 'issues' &&
          (contains(github.event.issue.title, '@claude') || contains(github.event.issue.body, '@claude'))) ||
        (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Same toolchain as ci.yml so Claude can run the test suites (test first, per CLAUDE.md).
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('api/**/*.csproj', 'api/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: dotnet restore
        working-directory: api

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5
            --max-turns 200
            --allowedTools "Bash(dotnet:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(tests/deploy/smoke.sh)"
            --append-system-prompt "This run was triggered from GitHub. Ignore the 'commit on master' rule: work on the branch the action provides. When the work is committed and the touched test suites pass, open a pull request against master with gh pr create (title: short summary; body: what changed, tests run, and 'Closes #<issue number>' when triggered from an issue), then reply with its link."
