<button mat-list-item type="button" (click)="open.emit()">
  <mat-icon matListItemIcon data-testid="entry-icon">{{ icon() }}</mat-icon>
  <span matListItemTitle
    ><span data-testid="entry-time">{{ time() | nalaEntryTime }}</span>
    @if (label()) {
      <span aria-hidden="true"> · </span><span data-testid="entry-label">{{ label() }}</span>
    }
  </span>
  <span matListItemLine data-testid="entry-summary">{{ summary() }}</span>
  <mat-icon matListItemMeta aria-hidden="true" data-testid="entry-chevron">chevron_right</mat-icon>
</button>
