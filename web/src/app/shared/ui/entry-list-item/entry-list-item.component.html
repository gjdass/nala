<button mat-list-item type="button" (click)="open.emit()">
  <mat-icon matListItemIcon data-testid="entry-icon">{{ icon() }}</mat-icon>
  <span matListItemTitle
    ><span data-testid="entry-time">{{
      dateOnly() ? (time() | nalaEntryDate) : (time() | nalaEntryTime)
    }}</span>
    @if (label()) {
      <span aria-hidden="true"> · </span><span data-testid="entry-label">{{ label() }}</span>
    }
  </span>
  <span matListItemLine data-testid="entry-summary">{{ summary() }}</span>
  <!-- Wrapped: as the meta itself, the two-line item's baseline strut would push the icon down and clip it. -->
  <span matListItemMeta class="meta">
    <mat-icon aria-hidden="true" data-testid="entry-chevron">chevron_right</mat-icon>
  </span>
</button>
