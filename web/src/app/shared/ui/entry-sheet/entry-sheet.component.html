<nala-sheet-header
  [section]="data.section"
  [title]="data.kind.label | transloco"
  [saveDisabled]="invalid() || saving() || saveDisabled()"
  (closed)="close()"
  (saved)="save.emit()"
/>
<div class="body">
  <ng-content />
  @if (canDelete()) {
    <div class="delete">
      <button
        mat-stroked-button
        type="button"
        [disabled]="saving()"
        (click)="confirmDelete()"
        data-testid="entry-delete"
      >
        {{ 'entrySheet.delete.action' | transloco }}
      </button>
    </div>
  }
</div>
