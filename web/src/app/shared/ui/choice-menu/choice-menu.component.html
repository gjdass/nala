<mat-menu #menu="matMenu" [ariaLabel]="ariaLabel() | transloco">
  @for (option of options(); track option.value) {
    @if (option.dividerBefore) {
      <mat-divider />
    }
    <button
      mat-menu-item
      type="button"
      role="menuitemradio"
      [attr.aria-checked]="option.value === value()"
      (click)="valueChange.emit(option.value)"
      [attr.data-testid]="optionTestId()"
    >
      @if (option.icon) {
        <mat-icon>{{ option.icon }}</mat-icon>
      }
      <span class="option">
        <span>{{ option.labelKey | transloco }}</span>
        <mat-pseudo-checkbox
          appearance="minimal"
          [state]="option.value === value() ? 'checked' : 'unchecked'"
        />
      </span>
    </button>
  }
</mat-menu>
