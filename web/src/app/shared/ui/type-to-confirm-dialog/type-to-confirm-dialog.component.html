<form (submit)="$event.preventDefault(); close(true)" novalidate>
  <h2 mat-dialog-title>{{ data.title }}</h2>
  <mat-dialog-content>
    <p data-testid="text">{{ data.text }}</p>
    <mat-form-field>
      <mat-label>{{ data.label }}</mat-label>
      <input
        matInput
        autocomplete="off"
        [value]="typed()"
        (input)="typed.set($any($event.target).value)"
        data-testid="typed"
      />
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="close(false)" data-testid="cancel">
      {{ data.cancel }}
    </button>
    <button mat-button type="submit" [disabled]="!matches()" data-testid="confirm">
      {{ data.confirm }}
    </button>
  </mat-dialog-actions>
</form>
