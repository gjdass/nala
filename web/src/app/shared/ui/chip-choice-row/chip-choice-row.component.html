<nala-form-row [label]="label()" [interactive]="false" [error]="error()">
  <mat-chip-listbox
    rowEditor
    [value]="value()"
    [disabled]="control().disabled"
    [attr.aria-label]="label()"
    (change)="choose($event)"
  >
    @for (option of options(); track option) {
      <mat-chip-option
        [value]="option"
        [selectable]="clearable() || option !== value()"
        [attr.data-testid]="name() + '-' + option"
      >
        @if (dotToken(); as token) {
          <span
            class="dot"
            aria-hidden="true"
            [style.background-color]="'var(' + token + option + ')'"
            [attr.data-testid]="name() + '-' + option + '-dot'"
          ></span>
        }
        @if (optionLabel(); as prefix) {
          {{ prefix + option | transloco }}
        } @else {
          {{ option }}
        }
      </mat-chip-option>
    }
  </mat-chip-listbox>
</nala-form-row>
