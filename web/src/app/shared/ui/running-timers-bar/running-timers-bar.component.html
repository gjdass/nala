@if (rows().length > 0) {
  <mat-action-list [attr.aria-label]="'timers.bar' | transloco">
    @for (row of rows(); track row.timer.id) {
      <button mat-list-item type="button" data-testid="timer-row" (click)="open(row.timer)">
        <span
          matListItemAvatar
          class="avatar"
          [style.background]="'var(--nala-section-' + row.timer.section + '-container)'"
          [style.color]="'var(--nala-on-section-' + row.timer.section + '-container)'"
          data-testid="timer-avatar"
        >
          <mat-icon aria-hidden="true" data-testid="timer-icon">{{ row.icon }}</mat-icon>
        </span>
        <span matListItemTitle data-testid="timer-label">{{
          row.timer.label | transloco: row.timer.labelParams
        }}</span>
        @if (row.baby) {
          <span matListItemLine data-testid="timer-baby">{{ row.baby }}</span>
        }
        <span matListItemMeta class="meta">
          <span data-testid="timer-duration">{{ row.seconds | nalaDuration }}</span>
          <mat-icon aria-hidden="true">chevron_right</mat-icon>
        </span>
      </button>
    }
  </mat-action-list>
}
