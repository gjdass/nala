<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>{{ data.text }}</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close(false)" data-testid="cancel">
    {{ data.cancel }}
  </button>
  <button mat-button type="button" (click)="close(true)" data-testid="confirm">
    {{ data.confirm }}
  </button>
</mat-dialog-actions>
