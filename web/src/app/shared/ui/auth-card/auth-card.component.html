<main>
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>{{ title() }}</mat-card-title>
      @if (subtitle()) {
        <mat-card-subtitle>{{ subtitle() }}</mat-card-subtitle>
      }
    </mat-card-header>
    <mat-card-content>
      <ng-content />
    </mat-card-content>
    <mat-card-actions align="end">
      <ng-content select="[authCardActions]" />
    </mat-card-actions>
  </mat-card>
</main>
