<h3>{{ 'members.title' | transloco }}</h3>
@if (loadError()) {
  <p class="error" role="alert" data-testid="members-error">
    {{ 'members.loadError' | transloco }}
  </p>
} @else {
  <mat-list>
    @for (member of list(); track member.id) {
      <nala-member-list-item
        [displayName]="member.displayName"
        [email]="member.email"
        [isAdmin]="member.isAdmin"
      >
        @if (isFamilyAdmin() && member.id !== userId()) {
          <button
            memberAction
            mat-button
            type="button"
            (click)="remove(member)"
            data-testid="remove"
          >
            {{ 'members.remove' | transloco }}
          </button>
        }
      </nala-member-list-item>
    }
  </mat-list>
}
