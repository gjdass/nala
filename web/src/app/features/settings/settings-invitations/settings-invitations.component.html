<div class="actions">
  <button
    mat-flat-button
    type="button"
    [disabled]="creating()"
    (click)="invite()"
    data-testid="invite"
  >
    {{ 'invitations.invite' | transloco }}
  </button>
</div>

<h3>{{ 'invitations.pending' | transloco }}</h3>
@if (loadError()) {
  <p class="error" role="alert" data-testid="invitations-error">
    {{ 'invitations.loadError' | transloco }}
  </p>
} @else if (pending().length === 0) {
  <p class="empty" data-testid="no-invitations">{{ 'invitations.none' | transloco }}</p>
} @else {
  <mat-list>
    @for (invitation of pending(); track invitation.id) {
      <nala-invitation-list-item
        [createdBy]="invitation.createdBy"
        [expiresAt]="invitation.expiresAt"
      >
        <button
          invitationAction
          mat-button
          type="button"
          (click)="revoke(invitation)"
          data-testid="revoke"
        >
          {{ 'invitations.revoke' | transloco }}
        </button>
      </nala-invitation-list-item>
    }
  </mat-list>
}
