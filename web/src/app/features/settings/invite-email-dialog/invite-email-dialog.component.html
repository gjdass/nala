<form [formGroup]="form" (ngSubmit)="send()" novalidate>
  <h2 mat-dialog-title>{{ 'invitations.emailDialog.title' | transloco }}</h2>
  <mat-dialog-content>
    <p>{{ textKey | transloco }}</p>
    <mat-form-field>
      <mat-label>{{ 'auth.fields.email' | transloco }}</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="off" data-testid="email" />
      @if (emailError(); as code) {
        <mat-error data-testid="error-email">{{
          'auth.errors.email.' + code | transloco
        }}</mat-error>
      }
    </mat-form-field>
    @if (formError(); as code) {
      <p class="form-error" role="alert" data-testid="form-error">
        {{ 'auth.errors.form.' + code | transloco }}
      </p>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()" data-testid="cancel">
      {{ 'invitations.emailDialog.cancel' | transloco }}
    </button>
    <button mat-flat-button type="submit" [disabled]="sending()" data-testid="send">
      {{ 'invitations.emailDialog.send' | transloco }}
    </button>
  </mat-dialog-actions>
</form>
