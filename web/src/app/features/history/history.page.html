<nala-top-app-bar
  [babies]="store.babies() ?? []"
  [selected]="store.selected()"
  (babySelected)="store.select($event)"
/>

<main>
  @if (store.loadError()) {
    <p class="error" role="alert" data-testid="babies-error">
      {{ 'babies.loadError' | transloco }}
    </p>
  } @else if (store.babies()?.length === 0) {
    <nala-no-baby />
  } @else if (loader(); as loader) {
    <nala-history-list [loader]="loader" [emptyTitle]="'history.emptyPeriod' | transloco">
      <ng-template nalaSectionEntry let-item>
        <nala-history-entry [item]="item" (open)="edit(item)" />
      </ng-template>
    </nala-history-list>
  }
</main>
