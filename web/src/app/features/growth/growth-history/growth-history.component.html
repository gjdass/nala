@if (loader(); as loader) {
  <nala-history-list key="growth" [loader]="loader">
    <ng-template nalaSectionEntry let-growthEntry>
      <nala-growth-entry
        [growthEntry]="growthEntry"
        [birthDate]="birthDate()"
        (open)="edit(growthEntry)"
      />
    </ng-template>
    @if (hasBirth()) {
      <ng-template nalaHistoryEnd>
        @let born = baby()!;
        <nala-growth-birth [baby]="born" (open)="editBaby(born)" />
      </ng-template>
    }
  </nala-history-list>
}
