<nala-entry-sheet
  [form]="form"
  [saving]="sheet.saving()"
  [deletable]="!!sheet.entry()"
  [discard]="sheet.discard()"
  (save)="save()"
  (delete)="sheet.delete()"
>
  @if (sheet.stillLive()) {
    <nala-banner
      icon="schedule"
      [title]="'sleep.stillSleeping.title' | transloco"
      [text]="
        'sleep.stillSleeping.sheet' | transloco: { since: sheet.entry()!.startTime | nalaTimeSince }
      "
    />
  }

  <nala-timer
    [seconds]="sheet.timerSeconds()"
    [running]="sheet.live()"
    [disabled]="sheet.saving() || sheet.manual()"
    (start)="sheet.start()"
    (stop)="sheet.stop()"
  />

  <nala-time-row [label]="'entrySheet.startTime' | transloco" [control]="form.controls.startTime" />
  @if (sheet.live()) {
    <nala-form-row
      [label]="'sleep.sheet.endTime' | transloco"
      [interactive]="false"
      data-testid="sleep-end-time"
    >
      <span rowTrailing>{{ 'sleep.sheet.sleeping' | transloco }}</span>
    </nala-form-row>
  } @else {
    <nala-time-row [label]="'sleep.sheet.endTime' | transloco" [control]="form.controls.endTime" />
  }

  <nala-form-row [label]="'sleep.sheet.duration' | transloco" [interactive]="false">
    <span rowTrailing data-testid="sleep-duration">{{
      sheet.seconds() === null ? '' : (sheet.seconds()! | nalaDuration)
    }}</span>
  </nala-form-row>

  <nala-notes-row [control]="form.controls.notes" />

  @if (sheet.formError(); as code) {
    <p class="form-error" role="alert" data-testid="form-error">
      {{ 'sleep.errors.' + code | transloco }}
    </p>
  }

  @if (sheet.entry(); as sleep) {
    <nala-entry-audit
      [loggedBy]="sleep.loggedBy.displayName"
      [editedBy]="sheet.edited() ? sleep.updatedBy.displayName : null"
      [editedAt]="sheet.edited() ? sleep.updatedAt : null"
    />
  }
</nala-entry-sheet>
