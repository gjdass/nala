@let entry = sleep();
<nala-entry-list-item
  icon="bedtime"
  [time]="entry.startTime"
  [summary]="
    entry.endTime
      ? ('sleep.summary'
        | transloco: { duration: seconds() | nalaDuration, end: entry.endTime | nalaEntryTime })
      : ('sleep.summaryLive' | transloco: { duration: seconds() | nalaDuration })
  "
  (open)="open.emit()"
/>
