@let entry = pump();
<nala-entry-list-item
  icon="water_drop"
  [time]="entry.startTime"
  [label]="total() === null ? '' : ('pump.volume' | transloco: { ml: total() })"
  [summary]="
    'pump.summary.' + sides()
      | transloco: { left: entry.leftMl, right: entry.rightMl, duration: seconds() | nalaDuration }
  "
  (open)="open.emit()"
/>
