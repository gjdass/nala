<nala-trends-load-state
  [error]="!!days.error()"
  [loaded]="days.hasValue()"
  (retry)="days.reload()"
>
  <nala-metric-card
    section="sleep"
    [title]="'trends.cards.sleep' | transloco"
    [headline]="sleepHeadline()"
    [empty]="loaded().length === 0"
  >
    <nala-bar-chart
      [bars]="sleepBars()"
      [series]="series()"
      [format]="format"
      [bucket]="bucket()"
      [lang]="lang()"
    />
  </nala-metric-card>
  <nala-metric-card
    section="sleep"
    [title]="'trends.cards.longestSleep' | transloco"
    [headline]="longestHeadline()"
    [empty]="longestEmpty()"
  >
    <nala-bar-chart
      [bars]="longestBars()"
      [series]="longestSeries()"
      [format]="format"
      [bucket]="bucket()"
      [lang]="lang()"
    />
  </nala-metric-card>
</nala-trends-load-state>
