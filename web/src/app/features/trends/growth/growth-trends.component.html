<nala-trends-load-state [error]="!!data.error()" [loaded]="data.hasValue()" (retry)="data.reload()">
  @if (sexHint()) {
    <p class="hint" data-testid="percentiles-hint">
      {{ 'trends.percentiles.hint' | transloco: { name: name() } }}
    </p>
  }
  @for (card of cards(); track card.key; let weight = $first) {
    <nala-metric-card
      section="growth"
      [title]="card.title"
      [headline]="card.headline"
      [perDay]="false"
      [detail]="card.detail"
      [empty]="card.points.length === 0 && !(weight && milestones().length > 0)"
    >
      <nala-line-chart
        [points]="card.points"
        [markers]="weight ? milestones() : []"
        [bands]="card.bands"
        [from]="from()"
        [to]="to()"
        [format]="card.format"
        [lang]="lang()"
      />
      @if (card.bands) {
        <p class="caption" data-testid="percentiles-caption">{{ caption() }}</p>
      }
    </nala-metric-card>
  }
</nala-trends-load-state>
