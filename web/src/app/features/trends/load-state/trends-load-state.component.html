@if (error()) {
  <div class="error" role="alert" data-testid="trends-error">
    <p>{{ 'trends.loadError' | transloco }}</p>
    <button mat-button type="button" (click)="retry.emit()" data-testid="trends-retry">
      {{ 'history.retry' | transloco }}
    </button>
  </div>
} @else if (loaded()) {
  <ng-content />
} @else {
  <mat-progress-spinner
    mode="indeterminate"
    diameter="32"
    [attr.aria-label]="'history.loading' | transloco"
    data-testid="trends-loading"
  />
}
