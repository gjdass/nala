<nala-section-card key="feed" [entries]="entries()" [running]="!!inProgress()" (changed)="reload()">
  @if (stillFeeding(); as feed) {
    <nala-banner
      sectionBanner
      icon="schedule"
      [title]="'feed.breastfeed.stillFeeding.title' | transloco"
      [text]="
        'feed.breastfeed.stillFeeding.card' | transloco: { since: feed.startTime | nalaTimeSince }
      "
      [actionLabel]="'feed.breastfeed.stillFeeding.review' | transloco"
      (action)="edit(feed)"
    />
  }
  @if (inProgress(); as feed) {
    <div sectionRunning class="running" data-testid="feed-running">
      <button
        mat-button
        type="button"
        class="feeding"
        (click)="edit(feed)"
        data-testid="feed-running-open"
      >
        {{ 'feed.card.feeding' | transloco }}
      </button>
      <nala-split-timer
        [compact]="true"
        [leftSeconds]="left()"
        [rightSeconds]="right()"
        [running]="running()"
        [disabled]="busy()"
        (start)="start($event)"
        (stop)="stop()"
      />
    </div>
  }
  @if (entries()?.[0]; as last) {
    <div sectionHighlight class="highlight" data-testid="feed-highlight">
      <mat-icon class="icon" aria-hidden="true">schedule</mat-icon>
      <div class="last">
        <span class="label" data-testid="feed-last-label">{{
          'feed.card.lastFeeding' | transloco
        }}</span>
        <span class="since" data-testid="feed-last-since">{{
          last.startTime | nalaTimeSince
        }}</span>
      </div>
      @if (lastSide(); as side) {
        <div class="side">
          <span class="side-value" data-testid="feed-last-side">{{
            'feed.card.side.' + side | transloco
          }}</span>
          <span class="label" data-testid="feed-last-side-label">{{
            'feed.card.lastSide' | transloco
          }}</span>
        </div>
      }
    </div>
  }
  <nala-empty-state
    sectionEmpty
    icon="restaurant"
    [title]="'feed.card.empty.title' | transloco"
    [text]="'feed.card.empty.text' | transloco"
  />
  <ng-template nalaSectionEntry let-feed>
    <nala-feed-entry [feed]="feed" (open)="edit(feed)" />
  </ng-template>
</nala-section-card>
