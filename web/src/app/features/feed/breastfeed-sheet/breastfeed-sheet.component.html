<nala-entry-sheet
  [form]="form"
  [saving]="busy()"
  [saveDisabled]="(!feed() && !typed()) || total() === 0"
  [deletable]="!!feed()"
  (save)="save()"
  (delete)="delete()"
>
  @if (stillFeeding()) {
    <nala-banner
      icon="schedule"
      [title]="'feed.breastfeed.stillFeeding.title' | transloco"
      [text]="
        'feed.breastfeed.stillFeeding.sheet'
          | transloco: { since: feed()!.startTime | nalaTimeSince }
      "
    />
  }

  <nala-split-timer
    [leftSeconds]="left()"
    [rightSeconds]="right()"
    [running]="running()"
    [markedSide]="markedSide()"
    [markLabel]="'feed.breastfeed.lastSide' | transloco"
    [disabled]="busy()"
    [editable]="true"
    [timersDisabled]="!!typed()"
    (start)="start($event)"
    (stop)="stop()"
    (edit)="editDuration($event)"
  />

  @if (askEndedOn()) {
    <nala-form-row
      [label]="'feed.breastfeed.endedOn' | transloco"
      [interactive]="false"
      data-testid="ended-on"
    >
      <mat-button-toggle-group
        rowEditor
        class="ended-on"
        [formControl]="form.controls.endedOn"
        [attr.aria-label]="'feed.breastfeed.endedOn' | transloco"
      >
        @for (side of sides; track side) {
          <mat-button-toggle [value]="side" [attr.data-testid]="'ended-on-' + side">
            {{ 'splitTimer.' + side | transloco }}
          </mat-button-toggle>
        }
      </mat-button-toggle-group>
    </nala-form-row>
  }

  <nala-time-row [label]="'entrySheet.startTime' | transloco" [control]="form.controls.startTime" />

  <nala-form-row [label]="'feed.breastfeed.totalTime' | transloco" [interactive]="false">
    <span rowTrailing data-testid="total-time">{{ total() | nalaDuration }}</span>
  </nala-form-row>

  <nala-notes-row [control]="form.controls.notes" />

  @if (formError(); as key) {
    <p class="form-error" role="alert" data-testid="form-error">{{ key | transloco }}</p>
  }

  @if (feed(); as feed) {
    <nala-entry-audit
      [loggedBy]="feed.loggedBy.displayName"
      [editedBy]="edited() ? feed.updatedBy.displayName : null"
      [editedAt]="edited() ? feed.updatedAt : null"
    />
  }
</nala-entry-sheet>
