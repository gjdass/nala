<nala-entry-sheet [form]="form" [saving]="saving()" (save)="save()" (delete)="delete()">
  <nala-time-row [label]="'entrySheet.time' | transloco" [control]="form.controls.time" />

  <nala-form-row [label]="'medication.sheet.name' | transloco" [interactive]="false">
    <mat-form-field rowEditor appearance="outline">
      <input
        matInput
        type="text"
        autocomplete="off"
        [maxlength]="nameMaxLength"
        [formControl]="form.controls.name"
        [attr.aria-label]="'medication.sheet.name' | transloco"
        data-testid="name"
      />
      <mat-error data-testid="name-error">{{
        'medication.errors.' + nameError() | transloco
      }}</mat-error>
    </mat-form-field>
  </nala-form-row>

  <nala-form-row [label]="'medication.sheet.dose' | transloco" [interactive]="false">
    <mat-form-field rowEditor appearance="outline">
      <input
        matInput
        type="number"
        inputmode="decimal"
        min="0.01"
        max="1000"
        step="0.01"
        [formControl]="form.controls.amount"
        [attr.aria-label]="'medication.sheet.dose' | transloco"
        data-testid="amount"
      />
      <mat-error data-testid="amount-error">{{
        'medication.errors.' + amountError() | transloco
      }}</mat-error>
    </mat-form-field>
  </nala-form-row>

  <nala-chip-choice-row
    name="unit"
    optionLabel="medication.unit."
    [label]="'medication.sheet.unit' | transloco"
    [options]="units"
    [control]="form.controls.unit"
    [error]="unitError()"
  />

  <nala-notes-row [control]="form.controls.notes" />

  @if (formError(); as code) {
    <p class="form-error" role="alert" data-testid="form-error">
      {{ 'medication.errors.' + code | transloco }}
    </p>
  }

  @if (medication; as medication) {
    <nala-entry-audit
      [loggedBy]="medication.loggedBy.displayName"
      [editedBy]="edited ? medication.updatedBy.displayName : null"
      [editedAt]="edited ? medication.updatedAt : null"
    />
  }
</nala-entry-sheet>
