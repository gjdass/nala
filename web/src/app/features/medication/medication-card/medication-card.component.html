<nala-section-card key="medication" [entries]="entries()" (changed)="reload()">
  @if (last(); as last) {
    <div sectionHighlight class="highlight" data-testid="medication-highlight">
      <mat-icon class="icon" aria-hidden="true">schedule</mat-icon>
      <div class="since">
        <span class="label" data-testid="medication-last-label">{{
          'medication.card.lastDose' | transloco
        }}</span>
        <span class="since-value" data-testid="medication-since">{{
          sinceSeconds() | nalaHighlightDuration
        }}</span>
      </div>
      <div class="last">
        <span class="last-value" data-testid="medication-last-name">{{ last.name }}</span>
        @if (last | nalaMedicationDose; as dose) {
          <span class="label" data-testid="medication-last-dose">{{ dose }}</span>
        }
      </div>
    </div>
  }
  <nala-empty-state
    sectionEmpty
    icon="medication"
    [title]="'medication.card.empty.title' | transloco"
    [text]="'medication.card.empty.text' | transloco"
  />
  <ng-template nalaSectionEntry let-medication>
    <nala-medication-entry [medication]="medication" (open)="edit(medication)" />
  </ng-template>
</nala-section-card>
