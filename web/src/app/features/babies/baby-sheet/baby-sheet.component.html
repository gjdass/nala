<nala-sheet-header
  [title]="(baby ? 'babies.sheet.editTitle' : 'babies.sheet.addTitle') | transloco"
  [saveDisabled]="invalid() || saving() || noFamily()"
  (closed)="close()"
  (saved)="save()"
/>
<div class="body">
  @if (formError(); as code) {
    <p class="form-error" role="alert" data-testid="form-error">
      {{ 'auth.errors.form.' + code | transloco }}
    </p>
  }
  <nala-baby-form [form]="form" />
  @if (canDelete()) {
    <div class="delete">
      <button
        mat-stroked-button
        type="button"
        [disabled]="saving()"
        (click)="delete()"
        data-testid="delete-baby"
      >
        {{ 'babies.delete.action' | transloco }}
      </button>
    </div>
  }
</div>
