<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <nala-auth-card
    [title]="'auth.setup.title' | transloco"
    [subtitle]="'auth.setup.subtitle' | transloco"
    [error]="formError() ? ('auth.errors.form.' + formError() | transloco) : null"
  >
    <nala-account-fields [form]="form" />
    <nala-family-name-field [control]="familyName" />

    <button
      authCardActions
      mat-flat-button
      type="submit"
      [disabled]="pending()"
      data-testid="submit"
    >
      {{ 'auth.setup.submit' | transloco }}
    </button>
  </nala-auth-card>
</form>
