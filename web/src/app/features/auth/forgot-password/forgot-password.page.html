@if (sentTo(); as sent) {
  <nala-auth-card [title]="'auth.forgot.title' | transloco">
    <p data-testid="sent">{{ 'auth.forgot.sent' | transloco: { email: sent } }}</p>
    <a authCardActions mat-button routerLink="/login" data-testid="to-login">
      {{ 'auth.forgot.toLogin' | transloco }}
    </a>
  </nala-auth-card>
} @else {
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <nala-auth-card
      [title]="'auth.forgot.title' | transloco"
      [subtitle]="'auth.forgot.subtitle' | transloco"
      [error]="formError() ? ('auth.errors.form.' + formError() | transloco) : null"
    >
      <mat-form-field>
        <mat-label>{{ 'auth.fields.email' | transloco }}</mat-label>
        <input
          matInput
          type="email"
          formControlName="email"
          autocomplete="username"
          data-testid="email"
        />
        @if (emailError(); as code) {
          <mat-error data-testid="error-email">{{
            'auth.errors.email.' + code | transloco
          }}</mat-error>
        }
      </mat-form-field>

      <a authCardActions mat-button routerLink="/login" data-testid="to-login">
        {{ 'auth.forgot.toLogin' | transloco }}
      </a>
      <button
        authCardActions
        mat-flat-button
        type="submit"
        [disabled]="pending()"
        data-testid="submit"
      >
        {{ 'auth.forgot.submit' | transloco }}
      </button>
    </nala-auth-card>
  </form>
}
