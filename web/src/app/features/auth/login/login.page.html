<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <nala-auth-card
    [title]="'auth.login.title' | transloco"
    [subtitle]="'auth.login.subtitle' | transloco"
    [error]="formError() ? ('auth.errors.form.' + formError() | transloco) : null"
  >
    <mat-form-field>
      <mat-label>{{ 'auth.fields.email' | transloco }}</mat-label>
      <input
        matInput
        type="email"
        formControlName="email"
        autocomplete="username"
        data-testid="email"
      />
      @if (errorOf('email'); as code) {
        <mat-error data-testid="error-email">{{
          'auth.errors.email.' + code | transloco
        }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field>
      <mat-label>{{ 'auth.fields.password' | transloco }}</mat-label>
      <input
        matInput
        type="password"
        formControlName="password"
        autocomplete="current-password"
        data-testid="password"
      />
      @if (errorOf('password'); as code) {
        <mat-error data-testid="error-password">{{
          'auth.errors.password.' + code | transloco
        }}</mat-error>
      }
    </mat-form-field>

    <button
      authCardActions
      mat-flat-button
      type="submit"
      [disabled]="pending()"
      data-testid="submit"
    >
      {{ 'auth.login.submit' | transloco }}
    </button>
  </nala-auth-card>
</form>
