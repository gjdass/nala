@let current = view();
@if (current.kind === 'loading') {
  <nala-auth-card [title]="'auth.register.title' | transloco">
    <mat-progress-bar
      mode="indeterminate"
      [attr.aria-label]="'auth.register.loading' | transloco"
    />
  </nala-auth-card>
} @else if (current.kind === 'unavailable') {
  <nala-auth-card
    [title]="'auth.register.title' | transloco"
    [error]="'auth.errors.form.' + current.code | transloco"
  >
    <a authCardActions mat-button routerLink="/login" data-testid="to-login">
      {{ 'auth.register.toLogin' | transloco }}
    </a>
  </nala-auth-card>
} @else if (current.kind === 'accept') {
  <nala-auth-card
    [title]="'auth.accept.title' | transloco"
    [subtitle]="
      'auth.accept.subtitle'
        | transloco: { name: current.invitation.invitedBy, family: current.invitation.familyName }
    "
    [error]="formError() ? ('auth.errors.form.' + formError() | transloco) : null"
  >
    <button authCardActions mat-button type="button" (click)="notNow()" data-testid="not-now">
      {{ 'auth.accept.notNow' | transloco }}
    </button>
    <button
      authCardActions
      mat-flat-button
      type="button"
      [disabled]="pending()"
      (click)="accept()"
      data-testid="accept"
    >
      {{ 'auth.accept.accept' | transloco }}
    </button>
  </nala-auth-card>
} @else {
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <nala-auth-card
      [title]="'auth.register.title' | transloco"
      [subtitle]="
        'auth.register.subtitle'
          | transloco: { name: current.invitation.invitedBy, family: current.invitation.familyName }
      "
      [error]="formError() ? ('auth.errors.form.' + formError() | transloco) : null"
    >
      <nala-account-fields [form]="form" emailTakenKey="auth.register.emailTaken" />

      <a
        authCardActions
        mat-button
        routerLink="/login"
        [queryParams]="{ invite: token }"
        data-testid="existing-account"
      >
        {{ 'auth.register.existingAccount' | transloco }}
      </a>
      <button
        authCardActions
        mat-flat-button
        type="submit"
        [disabled]="pending()"
        data-testid="submit"
      >
        {{ 'auth.register.submit' | transloco }}
      </button>
    </nala-auth-card>
  </form>
}
